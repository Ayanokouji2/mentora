version: "3.8"

services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./server:/app # Mount server code for live reload
            - /app/node_modules # Preserve container node_modules
        ports:
            - "5000:5000" # Map container port 5000 to host
        command: npm run dev
        environment:
            - NODE_ENV=development

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./client:/app # Mount client code for live reload
            - /app/node_modules
        ports:
            - "5173:5173" # Vite dev server
        depends_on:
            - server
        command: npm run dev
        environment:
            - CHOKIDAR_USEPOLLING=true # Needed for live reload on mounted volumes
